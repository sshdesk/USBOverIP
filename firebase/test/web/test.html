<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance WebRTC Mesh Client</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h2 { 
            color: #3ecf8e; 
            border-bottom: 1px solid #2e2e2e; 
            padding-bottom: 10px; 
        }
        .box { 
            background: #1e1e1e; 
            border: 1px solid #2e2e2e; 
            padding: 15px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
        }
        .rules { 
            border-left: 4px solid #3ecf8e; 
            background: #1a261f; 
            color: #a2ebd0; 
        }
        .btn { 
            background: #3ecf8e; 
            color: #121212; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn:hover { 
            opacity: 0.9; 
        }
        input[type="text"] { 
            background: #2e2e2e; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 9px; 
            border-radius: 4px; 
            width: 50%; 
            margin-right: 10px; 
        }
        #logCanvas { 
            background: #000; 
            border-radius: 4px; 
            padding: 15px; 
            font-family: monospace; 
            height: 350px; 
            overflow-y: auto; 
            font-size: 13px; 
            line-height: 1.5; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8); 
        }
        .log-info { color: #888; }
        .log-warn { color: #ff9900; }
        .log-error { color: #ff3333; }
        .log-success { color: #3ecf8e; font-weight: bold; }
        .log-chat { color: #bb86fc; }
    </style>
</head>
<body>

    <h2>=== Cross-Platform WebRTC Native Signaling Page ===</h2>
    
    <div id="setupProfile" class="box">
        <label for="roomInput">Target Room ID: </label>
        <input type="text" id="roomInput" value="arvind-shared-room" placeholder="Enter room ID...">
        <button id="btnConnect" class="btn">Connect Room (Auto-Detect Role)</button>
    </div>

    <div class="box rules">
        <strong>MESSAGE FORMAT RULES:</strong><br>
        • Type messages directly into your DevTools Console using: <code>sendMessage("ALL:your message")</code><br>
        • To target a peer: <code>sendMessage("peer_id:your private text payload")</code>
    </div>

    <div id="logCanvas"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
