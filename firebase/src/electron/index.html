<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebRTC USB/IP Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #1e1e24; color: #e0e0e0; padding: 16px; display: flex; flex-direction: column; height: 100vh; gap: 12px; }
    
    .panel { background: #282830; border: 1px solid #383842; border-radius: 6px; padding: 12px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    
    input[type="text"] { background: #16161a; border: 1px solid #444450; color: #fff; padding: 8px 12px; border-radius: 4px; outline: none; font-size: 13px; }
    input[type="text"]:focus { border-color: #5865f2; }
    
    label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #ccc; user-select: none; }
    
    button { background: #3a3a46; border: none; color: #fff; padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #4a4a58; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-primary { background: #4682b4; }
    button.btn-primary:hover { background: #5599d4; }
    button.btn-purple { background: #7b2cbf; }
    button.btn-purple:hover { background: #913cd9; }
    button.btn-danger { background: #b02a37; }
    button.btn-danger:hover { background: #c83241; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-offline { background: #442226; color: #ea868f; }
    .badge-online { background: #1e3a29; color: #75b798; }

    .content-area { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .section-col { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888896; font-weight: 700; }
    
    .list-box { flex: 1; background: #16161a; border: 1px solid #383842; border-radius: 4px; overflow-y: auto; padding: 6px; }
    .device-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: monospace; border: 1px solid transparent; margin-bottom: 4px; }
    .device-item:hover { background: #22222a; }
    .device-item.selected { background: #2c3854; border-color: #5875b2; color: #fff; }

    .terminal-box { flex: 1; background: #101014; border: 1px solid #282830; border-radius: 4px; overflow-y: auto; padding: 10px; font-family: 'Consolas', monospace; font-size: 12px; line-height: 1.4; color: #b0b0b8; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div class="panel toolbar">
    <label>
      <input type="checkbox" id="chkRemoteUsb"> For remote USB
    </label>
    <input type="text" id="roomInput" placeholder="Room ID (leave empty to auto-generate)" style="width: 240px;">
    
    <!-- Local USB Button -->
    <button id="btnHost" class="btn-primary">Connect</button>

    <!-- Remote USB Buttons (Hidden by default unless checkbox is ticked) -->
    <button id="btnConnect" class="btn-purple" style="display: none;">Connect</button>
    <button id="btnRefresh" style="display: none;">Refresh Devices</button>
    <button id="btnAttach" class="btn-purple" style="display: none;" disabled>RemoteAttach</button>
    <button id="btnDetach" class="btn-danger" style="display: none;">RemoteDetach</button>
  </div>

  <div class="status-bar">
    <div>Status: <span id="lblStatus" style="color:#75b798; font-weight:600;">Idle</span></div>
    <div style="display:flex; gap:16px; align-items:center;">
      <span>Client: <b id="lblClient">-</b></span>
      <span>Room: <b id="lblRoom">-</b></span>
      <span id="badgeDc" class="badge badge-offline">DataChannel: Closed</span>
    </div>
  </div>

  <div class="content-area">
    <div class="section-col">
      <div class="section-title">Available Devices</div>
      <div class="list-box" id="deviceList">
        <div style="color: #666; padding: 8px; font-size: 13px;">No devices loaded. Click Connect to begin.</div>
      </div>
    </div>

    <div class="section-col">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="section-title">Logs & Diagnostics</div>
        <button id="btnClearLogs" style="padding: 2px 8px; font-size: 11px;">Clear</button>
      </div>
      <div class="terminal-box" id="logBox"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
