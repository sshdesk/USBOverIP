name: Release packages

on:
  push:
    branches: [ master ]
    tags:
      - 'v*' # Trigger release actions when pushing version tags like v1.0.0

jobs:
  build-windows:
    runs-on: windows-2022
    steps:

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python modules install
        shell: cmd
        run: |
          pip install conan

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # We must turn off the checkout token optimization to allow Git LFS to authenticate correctly
      - name: Checkout Source code
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
          token: ${{ secrets.WHOLE_GITHUB_TOKEN }}

      - name: Force pull Git LFS files
        shell: bash
        run: |
          git lfs install
          git lfs pull

      - name: Install .NET WiX Toolset
        shell: powershell
        working-directory: firebase/src
        run: |
          dotnet new tool-manifest --force
          dotnet tool install wix
          dotnet wix eula accept wix7
          dotnet wix --version

      - name: Execute Project Build Pipeline & Package Installers
        shell: powershell
        working-directory: firebase/src
        env:
          GITHUB_TOKEN: ${{ secrets.WHOLE_GITHUB_TOKEN }}
        run: |
          $env:CONAN_HOME="C:\cr\"
          
          python ../conan-deps/src/conan-cache-generator.py --type windows_release --download --unpack
          
          python ../conan-deps/src/conan-cache-generator.py --build-project --type windows_release

          cmake --build build-cache-windows_release --config Release --target package_all_installers

      - name: Upload MSI Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            firebase/src/bin/USBIPElectron.msi
            firebase/src/bin/USBIPGui.msi
        env:
          GITHUB_TOKEN: ${{ secrets.WHOLE_GITHUB_TOKEN }}